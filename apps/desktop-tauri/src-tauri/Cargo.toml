[package]
name = "tessera-tauri"
version = "0.1.0-alpha.1"
description = "复用 Tessera renderer 的 Tauri v2 对照壳。"
authors = ["Tessera Contributors"]
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "tessera_tauri_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
